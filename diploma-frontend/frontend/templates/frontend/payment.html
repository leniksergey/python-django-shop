{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
  <div class="Middle Middle_top">
    <div class="Middle-top">
      <div class="wrap">
        <div class="Middle-header">
          <h1 class="Middle-title">Оплата</h1>
          <ul class="breadcrumbs Middle-breadcrumbs">
            <li class="breadcrumbs-item"><a href="/">Home</a></li>
            <li class="breadcrumbs-item breadcrumbs-item_current"><span>Оплата</span></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="Section">
      <div class="wrap">
        <form class="form Payment" @submit.prevent="submitPayment">
          <div class="Payment-card">
            <div class="form-group">
              <label for="number1" class="form-label">
                Номер карты
                <input class="form-input Payment-bill"
                       :class="{'form-input_error': errors.number1}"
                       id="number1" name="number1" type="text"
                       placeholder="9999 9999 9999 9999"
                       v-model="number1" maxlength="16">
              </label>
              <div v-if="errors.number1" class="form-error">${ errors.number1 }$</div>
            </div>
            <div class="form-group">
              <label for="month" class="form-label">
                Месяц
                <input class="form-input Payment-bill"
                       :class="{'form-input_error': errors.month}"
                       id="month" name="month" type="text"
                       placeholder="12"
                       v-model="month" maxlength="2">
              </label>
              <div v-if="errors.month" class="form-error">${ errors.month }$</div>
            </div>
            <div class="form-group">
              <label for="year" class="form-label">
                Год
                <input class="form-input Payment-bill"
                       :class="{'form-input_error': errors.year}"
                       id="year" name="year" type="text"
                       placeholder="27"
                       v-model="year" maxlength="4">
              </label>
              <div v-if="errors.year" class="form-error">${ errors.year }$</div>
            </div>
            <div class="form-group">
              <label for="code" class="form-label">
                CVV
                <input class="form-input Payment-bill"
                       :class="{'form-input_error': errors.code}"
                       id="code" name="code" type="text"
                       placeholder="000"
                       v-model="code" maxlength="3">
              </label>
              <div v-if="errors.code" class="form-error">${ errors.code }$</div>
            </div>
            <div class="form-group">
              <label for="name" class="form-label">
                ФИО
                <input class="form-input Payment-bill"
                       :class="{'form-input_error': errors.name}"
                       id="name" name="name" type="text"
                       placeholder="IVAN IVANOV"
                       v-model="name">
              </label>
              <div v-if="errors.name" class="form-error">${ errors.name }$</div>
            </div>
          </div>
          <div class="Payment-pay">
            <button class="btn btn_primary" type="submit">Оплатить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <style>
    .form-error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 4px;
      display: block;
    }
    .form-input_error {
      border-color: #d32f2f !important;
    }
  </style>
{% endblock %}

{% block mixins %}
<script src="{% static 'frontend/assets/js/payment.js' %}"></script>
{% endblock %}
